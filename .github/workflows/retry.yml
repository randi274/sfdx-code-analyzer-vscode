on:
  workflow_dispatch:
    inputs:
      github_run_id:
        required: true
jobs:
  Retry:
    runs-on: ubuntu-latest
    steps:
      - name: Retry ${{ inputs.github_run_id }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: |
          gh run watch ${{ inputs.github_run_id }} > /dev/null 2>&1
          gh run rerun ${{ inputs.github_run_id }} --failed